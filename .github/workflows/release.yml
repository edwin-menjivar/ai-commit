# Publishes to npm when a version tag is pushed:
#
#   npm version minor          # bumps package.json, commits and tags
#   git push --follow-tags
#
# Requires an npm automation token stored as NPM_TOKEN in the "release"
# environment. That environment only admits runs triggered by v* tags, so the
# token is never exposed to any other workflow run.
#
# Once the package exists on npm, prefer trusted publishing (OIDC) over a
# token: configure this repository and workflow file as a trusted publisher
# in the package's npm settings, remove NPM_TOKEN, and drop the
# NODE_AUTH_TOKEN line below. The id-token permission is already granted.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@edwin-menjivar/ai-commit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}" >&2
            exit 1
          fi

      # prepublishOnly runs typecheck, lint, tests and the build.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

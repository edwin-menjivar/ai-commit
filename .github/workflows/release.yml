# Publishes to npm when a version tag is pushed:
#
#   npm version minor          # bumps package.json, commits and tags
#   git push --follow-tags
#
# Requires an npm automation token stored as the NPM_TOKEN repository secret.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}" >&2
            exit 1
          fi

      # prepublishOnly runs typecheck, lint, tests and the build.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
